[package]
name = "resotool"
version = "0.3.1"
edition = "2024"
authors = ["Paul Buser <paul@beepyversion.com>"]
license = "GPL-3.0-or-later"
homepage = "https://beepyversion.com"
description = "MIDI controllable resonators"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib"]

[dependencies]
fundsp = "0.23.0"
nice-plug = { version = "0.4.2", default-features = false, features = [
    "vst3",
    "tracing-subscriber",
    "assert_process_allocs",
    "unsafe_flush_denormals",
] }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
